spring.config.activate.on-profile=prod
spring.application.name=authenticator

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:ERROR}

# MySQL Database Connection Properties
spring.datasource.url=jdbc:mysql://localhost:3306/eazybank
spring.datasource.username=root
spring.datasource.password=database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show.sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
